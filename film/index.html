<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>仰望 · Looking Up — CoolFly</title>
<script type="importmap">
{ "imports": { "three": "./vendor/three/three.module.js", "three/addons/": "./vendor/three/addons/" } }
</script>
<style>
  :root { --ui: rgba(255,255,255,0.86); --dim: rgba(255,255,255,0.4); --accent: #ff5a00; }
  html, body { margin: 0; height: 100%; background: #000; color: var(--ui); font: 13px/1.4 "Inter", system-ui, sans-serif; overflow: hidden; }
  #stage { position: fixed; inset: 0; display: grid; place-items: center; }
  canvas#film { width: min(100vw, calc(100vh * 16 / 9)); height: auto; aspect-ratio: 16 / 9; display: block; background: #000; }
  #ui { position: fixed; left: 0; right: 0; bottom: 0; padding: 18px 24px 16px; background: linear-gradient(transparent, rgba(0,0,0,0.75)); transition: opacity .4s; }
  body.idle #ui { opacity: 0; }
  body.render #ui, body.render #boot { display: none; }
  #bar { position: relative; height: 18px; cursor: pointer; }
  #track { position: absolute; left: 0; right: 0; top: 8px; height: 2px; background: rgba(255,255,255,0.18); }
  #fill { position: absolute; left: 0; top: 8px; height: 2px; background: var(--accent); width: 0; }
  .tick { position: absolute; top: 4px; width: 1px; height: 10px; background: rgba(255,255,255,0.35); }
  .tick span { position: absolute; bottom: 14px; left: -40px; width: 80px; text-align: center; font-size: 10px; letter-spacing: .08em; color: var(--dim); opacity: 0; transition: opacity .2s; white-space: nowrap; }
  #bar:hover .tick span { opacity: 1; }
  #row { display: flex; align-items: center; gap: 16px; margin-top: 8px; }
  button { background: none; border: 1px solid rgba(255,255,255,0.25); color: var(--ui); padding: 6px 12px; border-radius: 999px; font: inherit; cursor: pointer; }
  button:hover { border-color: var(--ui); }
  #time { font-variant-numeric: tabular-nums; color: var(--dim); }
  #boot { position: fixed; inset: 0; display: grid; place-items: center; background: #000; letter-spacing: .3em; color: var(--dim); font-size: 12px; }
  .sp { flex: 1; }
</style>
</head>
<body>
<div id="stage"><canvas id="film" width="1920" height="1080"></canvas></div>
<div id="boot">LOADING · 载入中</div>
<div id="ui">
  <div id="bar"><div id="track"></div><div id="fill"></div></div>
  <div id="row">
    <button id="play">▶ 播放 Play</button>
    <span id="time">0:00 / 5:00</span>
    <span class="sp"></span>
    <button id="subs">字幕 CC</button>
    <button id="fs">全屏 ⤢</button>
  </div>
</div>
<audio id="audio" src="assets/audio/score.m4a" preload="auto"></audio>
<script type="module">
import { film, init, renderFrame } from './src/film.js';
import { CHAPTERS, DURATION } from './src/script.js';

const params = new URLSearchParams(location.search);
const renderMode = params.has('render');
if (renderMode) document.body.classList.add('render');
const canvas = document.getElementById('film');
const audio = document.getElementById('audio');

await init(canvas, { base: './' });
document.getElementById('boot').remove();

// Render-mode API used by tools/render.mjs
window.renderFrame = (t) => { renderFrame(t); return true; };
window.filmReady = true;
if (renderMode) { renderFrame(parseFloat(params.get('t') || '0')); }
else {
  let t = parseFloat(params.get('t') || '0');
  let playing = false, last = 0, hasAudio = false;
  audio.addEventListener('canplay', () => { hasAudio = true; }, { once: true });
  audio.addEventListener('error', () => { hasAudio = false; });
  const fmt = (s) => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
  const bar = document.getElementById('bar'), fill = document.getElementById('fill'), time = document.getElementById('time'), btn = document.getElementById('play');
  for (const c of CHAPTERS) {
    const d = document.createElement('div'); d.className = 'tick'; d.style.left = (c.a / DURATION * 100) + '%';
    d.innerHTML = `<span>${c.n} · ${c.zh}</span>`; bar.appendChild(d);
  }
  const seek = (nt) => { t = Math.max(0, Math.min(DURATION, nt)); if (hasAudio) audio.currentTime = t; };
  const toggle = () => {
    playing = !playing; btn.textContent = playing ? '❚❚ 暂停 Pause' : '▶ 播放 Play';
    if (playing) { if (t >= DURATION) seek(0); if (hasAudio) { audio.currentTime = t; audio.play().catch(() => {}); } last = performance.now(); }
    else audio.pause();
  };
  btn.onclick = toggle;
  document.getElementById('subs').onclick = () => { film.showSubs = !film.showSubs; };
  document.getElementById('fs').onclick = () => (document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen());
  bar.onclick = (e) => { const r = bar.getBoundingClientRect(); seek((e.clientX - r.left) / r.width * DURATION); };
  addEventListener('keydown', (e) => {
    if (e.code === 'Space') { e.preventDefault(); toggle(); }
    if (e.code === 'ArrowRight') seek(t + 5);
    if (e.code === 'ArrowLeft') seek(t - 5);
    if (e.key === 'c') film.showSubs = !film.showSubs;
    if (e.key === 'f') document.getElementById('fs').click();
  });
  let idleT; addEventListener('mousemove', () => { document.body.classList.remove('idle'); clearTimeout(idleT); idleT = setTimeout(() => playing && document.body.classList.add('idle'), 2200); });
  const loop = (now) => {
    if (playing) {
      if (hasAudio && !audio.paused) t = audio.currentTime;
      else t += (now - last) / 1000;
      last = now;
      if (t >= DURATION) { t = DURATION; toggle(); }
    }
    renderFrame(t);
    fill.style.width = (t / DURATION * 100) + '%';
    time.textContent = `${fmt(t)} / ${fmt(DURATION)}`;
    requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);
}
</script>
</body>
</html>
