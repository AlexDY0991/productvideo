<script>window.__ready = false;</script>

<style>
  :root { --bone: #F2EFEA; --grey: #8A8A8E; --signal: #FF5A00; --black: #070708; }
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--black); }
  body { font-family: 'Jost', sans-serif; color: var(--bone); -webkit-font-smoothing: antialiased; }
  .layer { position: absolute; inset: 0; }
  .media { overflow: hidden; }
  .media img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transform-origin: 50% 50%; }
  #gl { position: absolute; inset: 0; width: 1920px; height: 1080px; }
  #grade { filter: contrast(1.04) saturate(0.94); }
  .vig { background: radial-gradient(120% 100% at 50% 45%, transparent 58%, rgba(0,0,0,.42) 100%); pointer-events: none; }
  .grain { inset: -64px; opacity: .06; mix-blend-mode: overlay; pointer-events: none;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='256' height='256'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }
  .card { background: radial-gradient(70% 60% at 50% 0%, #1b1b1d 0%, var(--black) 70%); display: flex; align-items: center; justify-content: center; }
  .t { position: absolute; will-change: transform, opacity, filter; }
  .title { font-weight: 300; font-size: 168px; letter-spacing: .42em; margin-right: -.42em; text-transform: uppercase; line-height: 1; }
  .sub { font-weight: 400; font-size: 44px; letter-spacing: .08em; color: #c9c7c3; }
  .label { font-weight: 500; font-size: 34px; letter-spacing: .26em; text-transform: uppercase; }
  .note { font-weight: 400; font-size: 32px; letter-spacing: .04em; color: var(--grey); }
  .num { font-weight: 300; font-size: 300px; line-height: .9; letter-spacing: -0.01em; display: flex; align-items: baseline; gap: 30px; justify-content: center; }
  .num.s { font-size: 220px; }
  .unit { font-weight: 300; font-size: 112px; position: relative; }
  .unit::after { content: ''; position: absolute; left: 0; right: 0; bottom: -10px; height: 4px; background: linear-gradient(90deg, transparent, var(--signal) 30%, var(--signal) 70%, transparent); }
  .col { display: flex; flex-direction: column; align-items: center; }
  .rule { width: 96px; height: 3px; background: var(--signal); }
  .spec { display: grid; grid-template-columns: auto auto; column-gap: 40px; row-gap: 18px; font-size: 44px; font-weight: 400; letter-spacing: .02em; }
  .spec .k { color: var(--grey); font-size: 34px; letter-spacing: .14em; text-transform: uppercase; align-self: center; }
